<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kiara — thoughtful, research-grounded psychology tests for self-understanding. Start with the validated attachment style test." />
    <title>Kiara — Tests for self-understanding</title>
    <script>
      // Apply theme before paint to avoid a flash. Defaults to dark.
      (function () {
        try {
          var t = localStorage.getItem("kiara:theme") || "dark";
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
